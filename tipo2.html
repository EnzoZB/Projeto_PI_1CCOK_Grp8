<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Estoque</title>
</head>

<body>

    <h1>Calculadora de Estoque de Vacinas</h1>

    <h2>Quantos tipos de vacina você possui?</h2>

    <input type="number" id="ipt_tipos">
    <button onclick="criarCampos()">Adicionar</button>

    <div id="div_vacinas"></div>

    <br>

    <button onclick="calcularEstoque()">Calcular estoque</button>

    <h2 id="resultado"></h2>

</body>

<script>

    function criarCampos() {

        let tipos = Number(ipt_tipos.value);
        let mensagem = "";

        if (tipos == 1) {

            mensagem = `
                <h3>Vacina 1</h3>

                <label>Quantidade:</label>
                <input type="number" id="qtd_1">

                <label>Valor unitário:</label>
                <input type="number" id="valor_1" step="0.01">
            `;

        } else if (tipos == 2) {

            mensagem = `
                <h3>Vacina 1</h3>
                <label>Quantidade:</label>
                <input type="number" id="qtd_1">

                <label>Valor unitário:</label>
                <input type="number" id="valor_1" step="0.01">

                <h3>Vacina 2</h3>
                <label>Quantidade:</label>
                <input type="number" id="qtd_2">

                <label>Valor unitário:</label>
                <input type="number" id="valor_2" step="0.01">
            `;

        } else if (tipos == 3) {

            mensagem = `
                <h3>Vacina 1</h3>
                <label>Quantidade:</label>
                <input type="number" id="qtd_1">

                <label>Valor unitário:</label>
                <input type="number" id="valor_1" step="0.01">

                <h3>Vacina 2</h3>
                <label>Quantidade:</label>
                <input type="number" id="qtd_2">

                <label>Valor unitário:</label>
                <input type="number" id="valor_2" step="0.01">

                <h3>Vacina 3</h3>
                <label>Quantidade:</label>
                <input type="number" id="qtd_3">

                <label>Valor unitário:</label>
                <input type="number" id="valor_3" step="0.01">
            `;

        } else if (tipos == 4) {

            mensagem = `
                <h3>Vacina 1</h3>
                <label>Quantidade:</label>
                <input type="number" id="qtd_1">

                <label>Valor unitário:</label>
                <input type="number" id="valor_1" step="0.01">

                <h3>Vacina 2</h3>
                <label>Quantidade:</label>
                <input type="number" id="qtd_2">

                <label>Valor unitário:</label>
                <input type="number" id="valor_2" step="0.01">

                <h3>Vacina 3</h3>
                <label>Quantidade:</label>
                <input type="number" id="qtd_3">

                <label>Valor unitário:</label>
                <input type="number" id="valor_3" step="0.01">

                <h3>Vacina 4</h3>
                <label>Quantidade:</label>
                <input type="number" id="qtd_4">

                <label>Valor unitário:</label>
                <input type="number" id="valor_4" step="0.01">
            `;

        } else if (tipos == 5) {

            mensagem = `
                <h3>Vacina 1</h3>
                <label>Quantidade:</label>
                <input type="number" id="qtd_1">

                <label>Valor unitário:</label>
                <input type="number" id="valor_1" step="0.01">

                <h3>Vacina 2</h3>
                <label>Quantidade:</label>
                <input type="number" id="qtd_2">

                <label>Valor unitário:</label>
                <input type="number" id="valor_2" step="0.01">

                <h3>Vacina 3</h3>
                <label>Quantidade:</label>
                <input type="number" id="qtd_3">

                <label>Valor unitário:</label>
                <input type="number" id="valor_3" step="0.01">

                <h3>Vacina 4</h3>
                <label>Quantidade:</label>
                <input type="number" id="qtd_4">

                <label>Valor unitário:</label>
                <input type="number" id="valor_4" step="0.01">

                <h3>Vacina 5</h3>
                <label>Quantidade:</label>
                <input type="number" id="qtd_5">

                <label>Valor unitário:</label>
                <input type="number" id="valor_5" step="0.01">
            `;

        } else {

            mensagem = "Digite uma quantidade entre 1 e 5.";

        }

        div_vacinas.innerHTML = mensagem;
    }


    function calcularEstoque() {

        let tipos = Number(ipt_tipos.value);
        let total = 0;

        if (tipos == 1) {

            let quantidade = Number(document.getElementById("qtd_1").value);
            let valor = Number(document.getElementById("valor_1").value);

            total = quantidade * valor;

        } else if (tipos == 2) {

            let qtd1 = Number(document.getElementById("qtd_1").value);
            let valor1 = Number(document.getElementById("valor_1").value);

            let qtd2 = Number(document.getElementById("qtd_2").value);
            let valor2 = Number(document.getElementById("valor_2").value);

            total = (qtd1 * valor1) + (qtd2 * valor2);

        } else if (tipos == 3) {

            let qtd1 = Number(document.getElementById("qtd_1").value);
            let valor1 = Number(document.getElementById("valor_1").value);

            let qtd2 = Number(document.getElementById("qtd_2").value);
            let valor2 = Number(document.getElementById("valor_2").value);

            let qtd3 = Number(document.getElementById("qtd_3").value);
            let valor3 = Number(document.getElementById("valor_3").value);

            total = (qtd1 * valor1) + (qtd2 * valor2) + (qtd3 * valor3);

        } else if (tipos == 4) {

            let qtd1 = Number(document.getElementById("qtd_1").value);
            let valor1 = Number(document.getElementById("valor_1").value);

            let qtd2 = Number(document.getElementById("qtd_2").value);
            let valor2 = Number(document.getElementById("valor_2").value);

            let qtd3 = Number(document.getElementById("qtd_3").value);
            let valor3 = Number(document.getElementById("valor_3").value);

            let qtd4 = Number(document.getElementById("qtd_4").value);
            let valor4 = Number(document.getElementById("valor_4").value);

            total = (qtd1 * valor1) + (qtd2 * valor2) + (qtd3 * valor3) + (qtd4 * valor4);

        } else if (tipos == 5) {

            let qtd1 = Number(document.getElementById("qtd_1").value);
            let valor1 = Number(document.getElementById("valor_1").value);

            let qtd2 = Number(document.getElementById("qtd_2").value);
            let valor2 = Number(document.getElementById("valor_2").value);

            let qtd3 = Number(document.getElementById("qtd_3").value);
            let valor3 = Number(document.getElementById("valor_3").value);

            let qtd4 = Number(document.getElementById("qtd_4").value);
            let valor4 = Number(document.getElementById("valor_4").value);

            let qtd5 = Number(document.getElementById("qtd_5").value);
            let valor5 = Number(document.getElementById("valor_5").value);

            total = (qtd1 * valor1) + (qtd2 * valor2) + (qtd3 * valor3) + (qtd4 * valor4) + (qtd5 * valor5);

        } else {

            resultado.innerHTML = "Digite uma quantidade entre 1 e 5.";
            return;

        }

        resultado.innerHTML = `Valor total do estoque: R$ ${total.toFixed(2)}`;
    }

</script>
