        function calcularEstoque() {

    let tipos = Number(ipt_tipos.value);
    
    let totalQuantidade = 0;
    let totalValor = 0;
    let resumo = "";

    if (tipos == 1) {

        let qtd1 = Number(document.getElementById("qtd_1").value);
        let valor1 = Number(document.getElementById("valor_1").value);
        let total1 = qtd1 * valor1;

        totalQuantidade = qtd1;
        totalValor = total1;

        resumo = `<div class="result-item"><b>Vacina 1:</b> ${qtd1} unidades | <b>Valor Unitário:</b> R$ ${valor1.toFixed(2)} | <b>Total:</b> R$ ${total1.toFixed(2)}</div>`;

    } else if (tipos == 2) {

        let qtd1 = Number(document.getElementById("qtd_1").value);
        let valor1 = Number(document.getElementById("valor_1").value);
        let total1 = qtd1 * valor1;

        let qtd2 = Number(document.getElementById("qtd_2").value);
        let valor2 = Number(document.getElementById("valor_2").value);
        let total2 = qtd2 * valor2;

        totalQuantidade = qtd1 + qtd2;
        totalValor = total1 + total2;

        resumo = `
            <div class="result-item"><b>Vacina 1:</b> ${qtd1} unidades | <b>Valor Unitário:</b> R$ ${valor1.toFixed(2)} | <b>Total:</b> R$ ${total1.toFixed(2)}</div>
            <div class="result-item"><b>Vacina 2:</b> ${qtd2} unidades | <b>Valor Unitário:</b> R$ ${valor2.toFixed(2)} | <b>Total:</b> R$ ${total2.toFixed(2)}</div>
        `;

    } else if (tipos == 3) {

        let qtd1 = Number(document.getElementById("qtd_1").value);
        let valor1 = Number(document.getElementById("valor_1").value);
        let total1 = qtd1 * valor1;

        let qtd2 = Number(document.getElementById("qtd_2").value);
        let valor2 = Number(document.getElementById("valor_2").value);

        let qtd3 = Number(document.getElementById("qtd_3").value);
        let valor3 = Number(document.getElementById("valor_3").value);
        let total3 = qtd3 * valor3;

        totalQuantidade = qtd1 + qtd2 + qtd3;
        totalValor = total1 + total2 + total3;

        resumo = `
            <div class="result-item"><b>Vacina 1:</b> ${qtd1} unidades | <b>Valor Unitário:</b> R$ ${valor1.toFixed(2)} | <b>Total:</b> R$ ${total1.toFixed(2)}</div>
            <div class="result-item"><b>Vacina 2:</b> ${qtd2} unidades | <b>Valor Unitário:</b> R$ ${valor2.toFixed(2)} | <b>Total:</b> R$ ${total2.toFixed(2)}</div>
            <div class="result-item"><b>Vacina 3:</b> ${qtd3} unidades | <b>Valor Unitário:</b> R$ ${valor3.toFixed(2)} | <b>Total:</b> R$ ${total3.toFixed(2)}</div>
        `;

        let total2 = qtd2 * valor2;

        let valor3 = Number(document.getElementById("valor_3").value);
        let total3 = qtd3 * valor3;

        let qtd4 = Number(document.getElementById("qtd_4").value);
        let valor4 = Number(document.getElementById("valor_4").value);
        let total4 = qtd4 * valor4;

        totalQuantidade = qtd1 + qtd2 + qtd3 + qtd4;
        totalValor = total1 + total2 + total3 + total4;

        resumo = `
            <div class="result-item"><b>Vacina 1:</b> ${qtd1} unidades | <b>Valor Unitário:</b> R$ ${valor1.toFixed(2)} | <b>Total:</b> R$ ${total1.toFixed(2)}</div>
            <div class="result-item"><b>Vacina 2:</b> ${qtd2} unidades | <b>Valor Unitário:</b> R$ ${valor2.toFixed(2)} | <b>Total:</b> R$ ${total2.toFixed(2)}</div>

            <div class="result-item"><b>Vacina 4:</b> ${qtd4} unidades | <b>Valor Unitário:</b> R$ ${valor4.toFixed(2)} | <b>Total:</b> R$ ${total4.toFixed(2)}</div>

            <div class="result-item"><b>Vacina 2:</b> ${qtd2} unidades | <b>Valor Unitário:</b> R$ ${valor2.toFixed(2)} | <b>Total:</b> R$ ${total2.toFixed(2)}</div>
            <div class="result-item"><b>Vacina 3:</b> ${qtd3} unidades | <b>Valor Unitário:</b> R$ ${valor3.toFixed(2)} | <b>Total:</b> R$ ${total3.toFixed(2)}</div>
